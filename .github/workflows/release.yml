name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repo validator
        run: python3 scripts/validate.py

      - name: Build per-skill ZIPs
        run: |
          mkdir -p dist
          cd skills
          for d in adadvisor*/; do
            name="${d%/}"
            zip -qr "../dist/${name}.zip" "$d"
            echo "Built dist/${name}.zip"
          done

      - name: Build all-in-one bundle
        run: |
          zip -qr dist/adadvisor-all-skills.zip \
            .claude-plugin/ \
            skills/ \
            README.md \
            LICENSE \
            VERSION
          echo "Built dist/adadvisor-all-skills.zip"

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release with ZIPs attached
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/adadvisor.zip
            dist/adadvisor-audit.zip
            dist/adadvisor-diagnose.zip
            dist/adadvisor-launch.zip
            dist/adadvisor-scale.zip
            dist/adadvisor-creative.zip
            dist/adadvisor-targeting.zip
            dist/adadvisor-playbooks.zip
            dist/adadvisor-all-skills.zip
